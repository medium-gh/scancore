name: Extensions runtime

# The Extensions runtime the desktop app downloads to run Mihon extensions:
# a Java trimmed with jlink and the extension host (host/), one zip per
# system with a .sha256 beside it, and CloudStream's and Echo's runtimes for
# Android (one dex in a jar each), kept as assets of an
# "extensions-runtime-<host version>" pre-release (pre-releases are never
# offered as app updates). The app asks for the version it was built with
# (HOST_VERSION in host/desktop/.../Main.kt and hostVersion in
# host/desktop/build.gradle.kts, kept equal).
#
# Run it by hand after the host changes in a way the app depends on, and
# raise the host version when you do, or push the tag
# extensions-runtime-<host version>.

on:
  workflow_dispatch:
  push:
    tags: ["extensions-runtime-*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, os: ubuntu-22.04 }
          - { name: Windows x64, os: windows-2022 }
          - { name: macOS arm64, os: macos-14 }
          - { name: macOS x64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Java 21: class-data sharing archives the app turns on (Java 19+).
      # Java 17: the host's Gradle toolchain, which not every runner has.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Build the runtime
        working-directory: host
        shell: bash
        run: ./gradlew --console=plain :desktop:test :desktop:runtimeZip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ matrix.os }}
          path: host/desktop/build/distributions/*

  # CloudStream's and Echo's runtimes for Android: one dex each, which the
  # app downloads when the first CloudStream plugin or Echo extension is
  # installed (host/cloudstream, host/echo).
  android:
    name: CloudStream and Echo for Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Build it
        working-directory: host
        run: |
          ./gradlew --console=plain :cloudstream:androidRuntime :echo:androidRuntime
          version=$(sed -n 's/^val hostVersion = "\(.*\)"$/\1/p' desktop/build.gradle.kts)
          mkdir -p dist
          for name in cloudstream echo; do
            cp "$name/build/android/$name-runtime-android.jar" "dist/SCANCORE-$name-runtime-$version-android.jar"
            (cd dist && sha256sum "SCANCORE-$name-runtime-$version-android.jar" > "SCANCORE-$name-runtime-$version-android.jar.sha256")
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-android-cloudstream
          path: host/dist/*

  publish:
    needs: [build, android]
    # What did build is still worth publishing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^val hostVersion = "\(.*\)"$/\1/p' host/desktop/build.gradle.kts)
          tag="extensions-runtime-$version"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --title "Extensions runtime $version" \
              --notes "The Java runtime and extension host SCANCORE downloads to run extensions on desktop. Not an app release."
          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
