name: CI

on:
  push:
    branches: [main, pre-release]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.11.3
  # qtwebview: the anime player on Windows (WebView2) and macOS (WKWebView).
  QT_MODULES: qtwebengine qtwebview qtwebchannel qtpositioning qtimageformats qtpdf qtspeech qtmultimedia

jobs:
  # A release moves main to a commit that already passed here on
  # pre-release; testing it again would only spend another 20 minutes.
  tested:
    name: Already tested?
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=pre-release&event=push&status=success&head_sha=$GITHUB_SHA"                   -q '.workflow_runs[0].id // empty')
          if [ -n "$RUN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_SHA passed on pre-release (run $RUN): not testing it again."
          fi

  build:
    name: ${{ matrix.name }}
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
            # aqtinstall cannot read the Windows 6.11 repository layout yet.
            qt: 6.10.3
          - name: macOS
            os: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Linux packages
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          tools/ci/apt-install.sh ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libfontconfig1-dev libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libmpv-dev

      - name: macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # The extension host (host/) and its tests.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt || env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      # Compiled objects kept between runs: only what a commit changed is
      # compiled again (about 11 minutes down to a few on Linux).
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ci-${{ matrix.name }}
          max-size: 400M

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSCANCORE_BUILD_TESTS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        # In parallel: every test keeps its own data and folders.
        run: ctest --test-dir build --output-on-failure --parallel 4
        env:
          QT_QPA_PLATFORM: offscreen

      # A test that ends in an exception loses its buffered output; the log
      # file keeps what QTest wrote before it.
      - name: Failed tests' logs
        if: failure() && runner.os == 'Windows'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for t in scancore_tests scancore_extension_tests scancore_host_tests; do
            exe=$(find build -name "$t.exe" | head -1)
            [ -n "$exe" ] || continue
            echo "=== $t"
            "$exe" -o "$t.txt,txt" -v1 || true
            cat "$t.txt" || true
          done
