name: Flatpak release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build or update, e.g. v1.0.0
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  flatpak:
    name: Build and upload Flatpak bundle
    # Pre-releases (v2.0.0-beta.1) get no Flatpak.
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    steps:
      # The manifest on main (or, run by hand, on the branch it is run from),
      # so a manual run can add a bundle to an older release with today's
      # manifest fixes.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}

      - name: Set release version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # A tag whose commit passed a complete test build on pre-release: the
      # Release workflow publishes that build's Flatpak (the same rule as its
      # "Test build of this commit" step), so nothing is built here.
      - name: Test build of this commit
        id: tested
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" -q .sha)
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?branch=pre-release&event=push&status=success&head_sha=$SHA" \
                  -q '.workflow_runs[0].id // empty')
          [ -n "$RUN" ] || exit 0
          HAVE=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts?per_page=100" -q '[.artifacts[] | select(.expired | not) | .name] | join(" ")')
          for NAME in scancore-Windows scancore-macOS scancore-AppImage scancore-Android scancore-Flatpak; do
            case " $HAVE " in *" $NAME "*) ;; *) exit 0 ;; esac
          done
          echo "The Release workflow publishes test build $RUN's Flatpak."
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Install Flatpak build tools
        if: steps.tested.outputs.published != 'true'
        run: |
          tools/ci/apt-install.sh flatpak flatpak-builder python3-yaml
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      # Run by hand for an older release: build that tag with this manifest.
      - name: Pin the requested release
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'PY'
          import os, yaml
          path = "com.mediumdev.scancore.yml"
          m = yaml.safe_load(open(path))
          app = next(mod for mod in m["modules"] if mod["name"] == "scancore")
          for s in app["sources"]:
              if s.get("url") == "https://github.com/medium-gh/scancore.git":
                  s["tag"] = os.environ["RELEASE_TAG"]
          yaml.safe_dump(m, open(path, "w"), sort_keys=False)
          PY

      - name: Check manifest release pin
        if: steps.tested.outputs.published != 'true'
        run: |
          APP_TAG=$(python3 -c 'import yaml; m=yaml.safe_load(open("com.mediumdev.scancore.yml")); print(next(s["tag"] for mod in m["modules"] if mod["name"] == "scancore" for s in mod["sources"] if s.get("url") == "https://github.com/medium-gh/scancore.git"))')
          if [ "$APP_TAG" != "$RELEASE_TAG" ]; then
            echo "The Flatpak manifest pins $APP_TAG, but this release is $RELEASE_TAG." >&2
            echo "Update the manifest's SCANCORE tag and commit on main before releasing." >&2
            exit 1
          fi

      - name: Build Flatpak bundle
        if: steps.tested.outputs.published != 'true'
        run: |
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=repo flatpak-build com.mediumdev.scancore.yml
          mkdir -p dist
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "dist/SCANCORE-$VERSION-linux-x86_64.flatpak" com.mediumdev.scancore master

      # Signed as the Release workflow signs every other package (<file>.sig,
      # Ed25519, base64): a release built here had a Flatpak without one.
      - name: Sign bundle
        if: steps.tested.outputs.published != 'true'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::The RELEASE_SIGNING_KEY secret is not set."
            exit 1
          fi
          set -o pipefail
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/signing.pem"
          for f in dist/*.flatpak; do
            openssl pkeyutl -sign -inkey "$RUNNER_TEMP/signing.pem" -rawin -in "$f" | base64 -w0 > "$f.sig"
          done
          rm -f "$RUNNER_TEMP/signing.pem"

      - name: Upload to GitHub release
        if: steps.tested.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The regular release workflow creates the GitHub release after its
          # platform builds finish. The Flatpak job starts at the same tag push,
          # so wait for that release instead of failing on a timing race.
          for attempt in $(seq 1 60); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" dist/*.flatpak dist/*.flatpak.sig --repo "$GITHUB_REPOSITORY" --clobber
              exit 0
            fi
            echo "Waiting for release $RELEASE_TAG (attempt $attempt/60)..."
            sleep 30
          done
          echo "Release $RELEASE_TAG was not created within 30 minutes." >&2
          exit 1
