name: Release

# Push a tag like v0.1.0 to build installers for Linux, Windows and macOS
# and publish them as a GitHub release. A push to the pre-release branch
# builds every package the same way as a test, keeps them as the run's
# artifacts and publishes nothing: a release is tagged once that passed, and
# the tag then publishes that run's packages instead of building them again
# (it builds only when no complete test build of the same commit exists). A tag with a pre-release label
# (v2.0.0-beta.1, SCANCORE_PRERELEASE in CMakeLists.txt) is published as a
# GitHub pre-release: installed copies never take it as an update, and the
# package manifests and the Flatpak skip it.
on:
  push:
    tags: ["v*"]
    branches: [pre-release]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write
  # Reading a pre-release test build's artifacts.
  actions: read

env:
  QT_VERSION: 6.11.3
  # The AppImage's Qt. Its Qt WebEngine is rebuilt with H.264 from Qt's
  # published sources (qtwebengine.yml), and Qt has not published 6.11.3's.
  LINUX_QT_VERSION: 6.11.2
  # qtwebview: the anime player on Windows (WebView2) and macOS (WKWebView).
  QT_MODULES: qtwebengine qtwebview qtwebchannel qtpositioning qtimageformats qtpdf qtspeech qtmultimedia

jobs:
  # Fails within seconds when the tag and the app's own version differ,
  # before any platform is built. Installed copies compare the version the
  # app reports, so a mismatch would keep offering the same update.
  version:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      linuxQt: ${{ env.LINUX_QT_VERSION }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      # A test build (a push to the pre-release branch): nothing is published.
      test: ${{ steps.check.outputs.test }}
      # The version packages are named and stamped with: the app's own, so a
      # test build's files are exactly what its release publishes.
      version: ${{ steps.check.outputs.version }}
      # A tag: the successful test build of the same commit whose packages
      # are published as they are (its run id), or empty to build.
      reuse: ${{ steps.reuse.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Tag matches CMakeLists.txt
        id: check
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          PROJECT_VERSION=$(sed -nE '/^project\(/,/\)/ s/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -1)
          if [ -z "$PROJECT_VERSION" ]; then
            echo "::error file=CMakeLists.txt::No VERSION found in project() in CMakeLists.txt."
            exit 1
          fi
          PRERELEASE=$(sed -nE 's/^set\(SCANCORE_PRERELEASE "([^"]*)"\)/\1/p' CMakeLists.txt | head -1)
          if [ -n "$PRERELEASE" ]; then
            PROJECT_VERSION="$PROJECT_VERSION-$PRERELEASE"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = branch ] && [ -z "${{ github.event.inputs.tag }}" ]; then
            echo "test=true" >> "$GITHUB_OUTPUT"
            echo "Test build of $PROJECT_VERSION from ${{ github.ref_name }}: every package is built, nothing is published."
            exit 0
          fi
          echo "test=false" >> "$GITHUB_OUTPUT"
          if [ "$PROJECT_VERSION" != "$VERSION" ]; then
            echo "::error file=CMakeLists.txt::Tag $TAG does not match the app version $PROJECT_VERSION in CMakeLists.txt (VERSION in project() and SCANCORE_PRERELEASE). Change them and tag again, or tag v$PROJECT_VERSION."
            exit 1
          fi
          echo "Tag $TAG matches CMakeLists.txt."
      # Desktop copies download the extension host separately (the
      # extensions-runtime-<host version> pre-release, extensions-runtime.yml)
      # and only check its version, so a host changed after that runtime was
      # built never reaches anyone (issue #14). Fails when the versions in the
      # app and the host differ, or when host/ changed since the runtime's
      # last build: raise the host version and publish its runtime first.
      - name: Extensions runtime is current
        if: steps.check.outputs.test != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet --tags --unshallow origin || git fetch --quiet --tags origin
          APP=$(sed -nE 's/.*HostVersion = "([^"]+)".*/\1/p' src/extensions/Runtime.h)
          HOST=$(sed -nE 's/^val hostVersion = "([^"]+)"$/\1/p' host/desktop/build.gradle.kts)
          MAIN=$(sed -nE 's/^const val HOST_VERSION = "([^"]+)"$/\1/p' host/desktop/src/main/kotlin/com/mediumdev/scancore/host/desktop/Main.kt)
          if [ "$APP" != "$HOST" ] || [ "$APP" != "$MAIN" ]; then
            echo "::error::Host versions differ: Runtime.h $APP, build.gradle.kts $HOST, Main.kt $MAIN."
            exit 1
          fi
          if ! gh release view "extensions-runtime-$APP" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::No extensions-runtime-$APP release. Push the tag extensions-runtime-$APP and let extensions-runtime.yml publish it first."
            exit 1
          fi
          BUILT=$(git tag --list "extensions-runtime-$APP" "extensions-runtime-$APP-*" --sort=-creatordate | head -1)
          if ! git diff --quiet "$BUILT" HEAD -- host/core host/desktop host/compat host/api host/build.gradle.kts host/settings.gradle.kts host/gradle; then
            echo "::error::host/ changed since $BUILT built the Extensions runtime. Raise the host version (Runtime.h, Main.kt, build.gradle.kts) and publish extensions-runtime-<new version> first."
            git diff --stat "$BUILT" HEAD -- host/core host/desktop host/compat host/api
            exit 1
          fi
          echo "Extensions runtime $APP was built from $BUILT; host/ is unchanged since."
      - name: Test build of this commit
        id: reuse
        if: steps.check.outputs.test != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?branch=pre-release&event=push&status=success&head_sha=$SHA" \
                  -q '.workflow_runs[0].id // empty')
          if [ -z "$RUN" ]; then
            echo "No successful test build of $SHA on pre-release: building."
            exit 0
          fi
          HAVE=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts?per_page=100" -q '[.artifacts[] | select(.expired | not) | .name] | join(" ")')
          for NAME in scancore-Windows scancore-macOS scancore-AppImage scancore-Android scancore-Android-armv7 scancore-Flatpak; do
            case " $HAVE " in
              *" $NAME "*) ;;
              *) echo "Test build $RUN has no $NAME: building."; exit 0 ;;
            esac
          done
          echo "Publishing the packages of test build $RUN (same commit $SHA)."
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  # Build codecs while the other release targets build. Only the Linux
  # AppImage needs this; other release artifacts can publish independently.
  webengine:
    needs: version
    if: needs.version.outputs.reuse == ''
    uses: ./.github/workflows/qtwebengine.yml
    with:
      qt: ${{ needs.version.outputs.linuxQt }}

  # The video player's libmpv for each desktop system. A system whose
  # libmpv fails still gets a release, playing anime in web players only.
  libmpv:
    needs: version
    if: needs.version.outputs.reuse == ''
    uses: ./.github/workflows/libmpv.yml

  build:
    name: ${{ matrix.name }}
    needs: [version, libmpv]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.reuse == '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            # aqtinstall cannot read the Windows 6.11 repository layout yet.
            qt: 6.10.3
            mpv: windows-x64
          - name: macOS
            os: macos-14
            mpv: macos-universal
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Version
        shell: bash
        run: echo "VERSION=${{ needs.version.outputs.version }}" >> "$GITHUB_ENV"

      - name: macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: libmpv
        id: mpv
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: libmpv-${{ matrix.mpv }}
          path: build/libmpv/${{ matrix.mpv }}

      - name: Use libmpv
        if: steps.mpv.outcome == 'success'
        shell: bash
        run: |
          dir="$PWD/build/libmpv/${{ matrix.mpv }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # D:/a/... rather than Git Bash's /d/a/..., which CMake and
            # PowerShell would read as D:\d\a\...
            dir="$(cygpath -m "$dir")"
            # MSVC links through an import library made from mpv's exports.
            # Dash options: Git Bash rewrites "/nologo" into a path.
            lib -nologo -def:"$(cygpath -w "$dir/lib/mpv.def")" -machine:x64 -out:"$(cygpath -w "$dir/lib/mpv.lib")"
          else
            ln -sf libmpv.2.dylib "$dir/lib/libmpv.dylib"
          fi
          echo "MPV_DIR=$dir" >> "$GITHUB_ENV"

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt || env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      # Compiled objects kept between runs (tools/ci, ci.yml): a release
      # compiles only what changed since the last one.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-${{ matrix.name }}
          max-size: 500M

      - name: Build
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0"; fi
          # SCANCORE_WITH_EXTENSION_HOST=OFF: users download the Extensions
          # runtime; the host from host/ is for development builds.
          # AVIF: no universal (arm64 + x86_64) libavif to link here yet.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSCANCORE_BUILD_TESTS=OFF \
            -DSCANCORE_WITH_EXTENSION_HOST=OFF -DSCANCORE_WITH_AVIF=OFF -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache $EXTRA
          cmake --build build --parallel

      # ---------------------------------------------------------------- Windows
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\windows | Out-Null
          Copy-Item build\bin\scancore.exe dist\windows\
          if ($env:MPV_DIR) {
            Copy-Item "$env:MPV_DIR\bin\libmpv-2.dll" dist\windows\
            Copy-Item -Recurse "$env:MPV_DIR\licenses" dist\windows\licenses
          }
          windeployqt --release --qmldir src\qml --no-translations --compiler-runtime dist\windows\scancore.exe
          # The anime player's WebView2 backend, which windeployqt may leave out.
          if (-not (Test-Path dist\windows\plugins\webview\qtwebview_webview2.dll)) {
            New-Item -ItemType Directory -Force dist\windows\plugins\webview | Out-Null
            Copy-Item "$env:QT_ROOT_DIR\plugins\webview\qtwebview_webview2.dll" dist\windows\plugins\webview\
          }
          Compress-Archive -Path dist\windows\* -DestinationPath "dist\SCANCORE-$env:VERSION-windows-x64-portable.zip"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\dist\windows" `
            "/O$PWD\dist" packaging\windows\scancore.iss

      # ---------------------------------------------------------------- macOS
      - name: macOS disk image
        if: runner.os == 'macOS'
        env:
          # Signing and notarization (#31), when the repository has them:
          # MACOS_CERTIFICATE (a Developer ID Application .p12, base64),
          # MACOS_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_TEAM_ID and
          # APPLE_APP_PASSWORD (an app-specific password). Without them the
          # disk image is made as before, unsigned.
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          cp -R build/bin/scancore.app SCANCORE.app
          if [ -n "${MPV_DIR:-}" ]; then
            # The player's libmpv (@rpath/libmpv.2.dylib) beside Qt's frameworks.
            mkdir -p SCANCORE.app/Contents/Frameworks
            cp "$MPV_DIR/lib/libmpv.2.dylib" SCANCORE.app/Contents/Frameworks/
            mkdir -p SCANCORE.app/Contents/Resources
            cp -R "$MPV_DIR/licenses" SCANCORE.app/Contents/Resources/licenses
            otool -l SCANCORE.app/Contents/MacOS/scancore | grep -q '@executable_path/../Frameworks' || \
              install_name_tool -add_rpath @executable_path/../Frameworks SCANCORE.app/Contents/MacOS/scancore
          fi
          # The anime player's WKWebView backend, in case macdeployqt leaves it
          # out; listed with -executable so its Qt references are rewritten.
          mkdir -p SCANCORE.app/Contents/PlugIns/webview
          cp "$QT_ROOT_DIR/plugins/webview/libqtwebview_darwin.dylib" SCANCORE.app/Contents/PlugIns/webview/
          mkdir -p dist
          if [ -z "${MACOS_CERTIFICATE:-}" ] || [ -z "${APPLE_ID:-}" ]; then
            macdeployqt SCANCORE.app -qmldir=src/qml -dmg -always-overwrite \
              -executable=SCANCORE.app/Contents/PlugIns/webview/libqtwebview_darwin.dylib
            mv SCANCORE.dmg "dist/SCANCORE-$VERSION-macos-universal.dmg"
            exit 0
          fi
          # A keychain of its own for the Developer ID certificate.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          macdeployqt SCANCORE.app -qmldir=src/qml -always-overwrite \
            -executable=SCANCORE.app/Contents/PlugIns/webview/libqtwebview_darwin.dylib
          # Inside out: every library and plug-in, then the app, with the
          # hardened runtime and a secure timestamp.
          find SCANCORE.app/Contents \( -name '*.dylib' -o -name '*.so' \) -type f -print0 | \
            xargs -0 codesign --force --timestamp --options runtime --sign "$IDENTITY"
          find SCANCORE.app/Contents/Frameworks -name '*.framework' -maxdepth 1 -print0 | \
            xargs -0 codesign --force --timestamp --options runtime --sign "$IDENTITY"
          codesign --force --timestamp --options runtime --entitlements packaging/macos/entitlements.plist \
            --sign "$IDENTITY" SCANCORE.app
          codesign --verify --deep --strict SCANCORE.app
          hdiutil create -volname SCANCORE -srcfolder SCANCORE.app -ov -format UDZO SCANCORE.dmg
          codesign --force --timestamp --sign "$IDENTITY" SCANCORE.dmg
          # Apple checks it; the ticket is stapled so it opens offline too.
          xcrun notarytool submit SCANCORE.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple SCANCORE.dmg
          mv SCANCORE.dmg "dist/SCANCORE-$VERSION-macos-universal.dmg"
          security delete-keychain "$KEYCHAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: scancore-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*setup.exe
            dist/*.dmg
          if-no-files-found: error

  # The packages just built, started once on their own system: a comic, a
  # book and a video open (tests/app/Smoke.qml), with a picture of each in
  # the run's artifacts (scancore-smoke-<system>). 2.13.0 nearly shipped a
  # macOS build that did not start.
  smoke:
    name: Smoke run (${{ matrix.name }})
    needs: [version, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-2022 }
          - { name: macOS, os: macos-14 }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          sparse-checkout: |
            tests/app
            tests/fixtures/smoke
            tests/fixtures/video
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: scancore-${{ matrix.name }}
          path: package
      - name: Start the portable package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-ChildItem package\*-portable.zip).FullName -DestinationPath app
          $repo = (Get-Location).Path -replace '\\', '/'
          New-Item -ItemType Directory -Force smoke | Out-Null
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $env:SCANCORE_START = '{"probe":"file:///' + $repo + '/tests/app/Smoke.qml","size":[1280,800],"fixtures":"' + $repo + '/tests/fixtures","out":"' + $repo + '/smoke"}'
          $exe = (Get-ChildItem app -Recurse -Filter scancore.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $exe -PassThru -Wait -RedirectStandardError smoke\log.txt -RedirectStandardOutput smoke\out.txt
          Get-Content smoke\log.txt | Select-String -Pattern 'SMOKE|Smoke.qml|rror'
          if ($p.ExitCode -ne 0) { throw "Smoke run failed ($($p.ExitCode))" }
      - name: Start the disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach package/*.dmg -mountpoint /Volumes/SCANCORE -nobrowse
          mkdir -p smoke
          exe=$(ls /Volumes/SCANCORE/SCANCORE.app/Contents/MacOS/* | head -1)
          QT_FORCE_STDERR_LOGGING=1 \
          SCANCORE_START="{\"probe\":\"file://$PWD/tests/app/Smoke.qml\",\"size\":[1280,800],\"fixtures\":\"$PWD/tests/fixtures\",\"out\":\"$PWD/smoke\"}" \
            "$exe" > smoke/log.txt 2>&1 && status=0 || status=$?
          grep -E 'SMOKE|Smoke.qml|rror' smoke/log.txt || true
          hdiutil detach /Volumes/SCANCORE || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scancore-smoke-${{ matrix.name }}
          path: smoke
          if-no-files-found: warn

  # Built beside the other packages (it used to wait for publish, and with
  # it for every other job); only its upload to the release waits
  # (appimage-release).
  appimage:
    name: Linux AppImage
    needs: [version, webengine, libmpv]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.reuse == '' && needs.webengine.result == 'success' && needs.webengine.outputs.available == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Version
        run: |
          echo "VERSION=${{ needs.version.outputs.version }}" >> "$GITHUB_ENV"
          echo "LINUX_QT_VERSION=${{ needs.version.outputs.linuxQt }}" >> "$GITHUB_ENV"

      - name: Linux packages
        timeout-minutes: 20
        run: |
          # The last line: what the CI-built libmpv.so links (libmpv.yml),
          # for the link and for linuxdeploy to bundle.
          tools/ci/apt-install.sh ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libfontconfig1-dev libnss3 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libfuse2 file \
            libass9 libva2 libva-drm2 libdrm2 libbz2-1.0 libxfixes3 libasound2 libpulse0 libegl1

      # AVIF covers and pages: libavif decoding through dav1d alone (Ubuntu's
      # also brings three AV1 encoders the AppImage has no use for).
      - name: libavif
        run: |
          tools/ci/apt-install.sh libdav1d-dev
          git clone --depth 1 --branch v1.3.0 https://github.com/AOMediaCodec/libavif.git "$RUNNER_TEMP/libavif"
          cmake -S "$RUNNER_TEMP/libavif" -B "$RUNNER_TEMP/libavif/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON -DAVIF_CODEC_DAV1D=SYSTEM -DAVIF_LIBYUV=OFF -DAVIF_BUILD_APPS=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build "$RUNNER_TEMP/libavif/build"
          sudo cmake --install "$RUNNER_TEMP/libavif/build"
          sudo ldconfig

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ needs.version.outputs.linuxQt }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Qt WebEngine with codecs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "qtwebengine-$LINUX_QT_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "qtwebengine-$LINUX_QT_VERSION-codecs-linux-x86_64.tar.xz" --dir "$RUNNER_TEMP"
          tar -xJf "$RUNNER_TEMP/qtwebengine-$LINUX_QT_VERSION-codecs-linux-x86_64.tar.xz" -C "$QT_ROOT_DIR"
          echo "Qt WebEngine with codecs laid over $QT_ROOT_DIR."

      - name: libmpv
        id: mpv
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: libmpv-linux-x86_64
          path: build/libmpv/linux-x86_64

      # Compiled objects kept between runs (tools/ci, ci.yml): a release
      # compiles only what changed since the last one.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-AppImage
          max-size: 500M

      - name: Build
        run: |
          if [ "${{ steps.mpv.outcome }}" = success ]; then
            export MPV_DIR=$PWD/build/libmpv/linux-x86_64
            ln -sf "$(ls "$MPV_DIR"/lib/libmpv.so.* | head -1 | xargs basename)" "$MPV_DIR/lib/libmpv.so"
            echo "MPV_DIR=$MPV_DIR" >> "$GITHUB_ENV"
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSCANCORE_BUILD_TESTS=OFF \
            -DSCANCORE_WITH_EXTENSION_HOST=OFF -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel

      - name: AppImage
        run: |
          DESTDIR=$PWD/AppDir cmake --install build
          if [ -n "${MPV_DIR:-}" ]; then
            mkdir -p AppDir/usr/share/licenses
            cp -r "$MPV_DIR/licenses" AppDir/usr/share/licenses/libmpv
          fi
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          find "$QT_ROOT_DIR/plugins/sqldrivers" -type f ! -name 'libqsqlite.so' -delete
          # linuxdeploy finds libmpv (outside the install) through this too.
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib${MPV_DIR:+:$MPV_DIR/lib}:${LD_LIBRARY_PATH:-}"
          find "$QT_ROOT_DIR/plugins" -name '*.so' | while read -r plugin; do
            if ldd "$plugin" | grep -q 'not found'; then
              echo "Removing $plugin (unresolved: $(ldd "$plugin" | grep 'not found' | awk '{print $1}' | paste -sd' '))"
              rm -f "$plugin"
            fi
          done
          export QML_SOURCES_PATHS=$PWD/src/qml
          export EXTRA_QT_MODULES="svg"
          PLUGINS=$(ls "$QT_ROOT_DIR/plugins/platforms" | grep -i wayland | paste -sd ';' || true)
          [ -n "$PLUGINS" ] && export EXTRA_PLATFORM_PLUGINS="$PLUGINS"
          echo "Wayland plugins: $PLUGINS"
          export LDAI_OUTPUT=SCANCORE-$VERSION-linux-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --desktop-file packaging/linux/com.mediumdev.scancore.desktop \
            --icon-file packaging/linux/com.mediumdev.scancore.png \
            --plugin qt
          for dir in "$QT_ROOT_DIR"/plugins/wayland-*; do
            [ -d "$dir" ] && cp -r "$dir" AppDir/usr/plugins/
          done
          rm -f AppDir/usr/lib/libnss3.so AppDir/usr/lib/libnssutil3.so AppDir/usr/lib/libsmime3.so \
                AppDir/usr/lib/libnspr4.so AppDir/usr/lib/libplc4.so AppDir/usr/lib/libplds4.so
          LIBS=$(find AppDir/usr/plugins/wayland-* -name '*.so' -printf ' --library %p' 2>/dev/null || true)
          NSS_EXCLUDES=""
          for lib in libnss3 libnssutil3 libsmime3 libnspr4 libplc4 libplds4; do
            NSS_EXCLUDES="$NSS_EXCLUDES --exclude-library $lib.so*"
          done
          ./linuxdeploy-x86_64.AppImage --appdir AppDir $LIBS $NSS_EXCLUDES --output appimage
          if ls AppDir/usr/lib | grep -E '^lib(nss3|nssutil3|smime3|nspr4|plc4|plds4)\.so'; then
            echo "NSS libraries were bundled; the anime player would crash on newer distributions" >&2
            exit 1
          fi
          mkdir -p dist && mv SCANCORE-*.AppImage dist/

      # A test build keeps it (the tag publishes it from there); a release
      # hands it to appimage-release.
      - name: Keep the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: scancore-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  # The AppImage built by this run, added once the release exists.
  appimage-release:
    name: Add AppImage to release
    needs: [version, appimage, publish]
    if: ${{ !cancelled() && needs.version.outputs.test != 'true' && needs.version.outputs.reuse == '' && needs.appimage.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scancore-AppImage
          path: dist
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.inputs.tag || github.ref_name }}" dist/*.AppImage --repo "$GITHUB_REPOSITORY" --clobber

  # A test build checks the Flatpak manifest here first (everything in it,
  # with the app built from this commit instead of the pinned tag) and keeps
  # the bundle, which the tag publishes (flatpak-release.yml then builds
  # only when there is none).
  flatpak:
    name: Flatpak
    needs: version
    if: needs.version.outputs.test == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Flatpak build tools
        timeout-minutes: 20
        run: |
          tools/ci/apt-install.sh flatpak flatpak-builder python3-yaml
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      # flatpak-builder's own cache: the libraries (dav1d … mpv, about 8
      # minutes, ffmpeg most of it) are built again only when their part of
      # the manifest changes, and --ccache keeps the app's compiled objects.
      - name: Flatpak build cache
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-${{ hashFiles('com.mediumdev.scancore.yml') }}-${{ github.sha }}
          restore-keys: flatpak-
      - name: Build from this commit
        run: |
          mkdir -p .flatpak-builder/ccache
          echo "max_size = 600M" > .flatpak-builder/ccache/ccache.conf
          python3 - <<'EOF'
          import yaml
          m = yaml.safe_load(open("com.mediumdev.scancore.yml"))
          app = next(mod for mod in m["modules"] if mod["name"] == "scancore")
          app["sources"] = [{"type": "dir", "path": ".", "skip": ["flatpak-build", ".flatpak-builder"]} if s.get("url") == "https://github.com/medium-gh/scancore.git" else s
                            for s in app["sources"]]
          yaml.safe_dump(m, open("test.flatpak.yml", "w"), sort_keys=False)
          EOF
          flatpak-builder --user --force-clean --ccache --install-deps-from=flathub \
            --repo=repo flatpak-build test.flatpak.yml
          # Only the build stages and compiled objects go back in the cache.
          rm -rf .flatpak-builder/build .flatpak-builder/rofiles
          mkdir -p dist
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "dist/SCANCORE-${{ needs.version.outputs.version }}-linux-x86_64.flatpak" com.mediumdev.scancore master
      - uses: actions/upload-artifact@v4
        with:
          name: scancore-Flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  # One APK per processor: arm64 (most phones) and armv7 (32-bit phones,
  # issue #19).
  android:
    name: Android ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.reuse == ''
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: arm64, qtArch: android_arm64_v8a, mpv: android-arm64, artifact: scancore-Android }
          - { name: armv7, qtArch: android_armv7, mpv: android-armv7, artifact: scancore-Android-armv7 }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Version
        run: echo "VERSION=${{ needs.version.outputs.version }}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Tools
        run: |
          tools/ci/apt-install.sh ninja-build
          # Android 37: the extension host's OkHttp needs it to compile against.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Qt (host)
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.2
          cache: true

      - name: Qt (Android)
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.2
          # Qt 6.7+ publishes Android packages under the all_os host.
          host: all_os
          target: android
          arch: ${{ matrix.qtArch }}
          modules: qtwebview qtimageformats qtwebchannel qtpositioning
          cache: true

      # The video player's libmpv (LGPL, tools/libmpv/build.sh), built again
      # only when the script changes.
      - name: libmpv cache
        id: libmpv
        uses: actions/cache@v4
        with:
          path: build/libmpv/${{ matrix.mpv }}
          key: libmpv-${{ matrix.mpv }}-${{ hashFiles('tools/libmpv/build.sh') }}

      - name: libmpv
        if: steps.libmpv.outputs.cache-hit != 'true'
        run: |
          tools/ci/apt-install.sh nasm gperf python3-jinja2
          pipx install meson
          tools/libmpv/build.sh ${{ matrix.mpv }}

      # Compiled objects kept between runs (tools/ci, ci.yml): a release
      # compiles only what changed since the last one.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-Android-${{ matrix.name }}
          max-size: 500M

      - name: Signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/scancore.jks"
          export QT_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/scancore.jks" QT_ANDROID_KEYSTORE_ALIAS=scancore
          export QT_ANDROID_KEYSTORE_STORE_PASS="$KEYSTORE_PASSWORD" QT_ANDROID_KEYSTORE_KEY_PASS="$KEYSTORE_PASSWORD"
          HOST_QT=$(dirname "$QT_ROOT_DIR")/gcc_64
          # Qt's android_armv7 package ships qt-cmake without its execute bit.
          sh "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$HOST_QT" -DANDROID_SDK_ROOT="$ANDROID_HOME" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DQT_ANDROID_SIGN_APK=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel
          cmake --build build --target apk
          mkdir -p dist
          cp build/src/android-build/build/outputs/apk/release/android-build-release-signed.apk \
            "dist/SCANCORE-$VERSION-android-${{ matrix.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.apk
          if-no-files-found: error

  publish:
    needs: [version, build, android]
    # Publish the independent desktop and Android artifacts without waiting
    # for the hours-long Linux codec build.
    if: ${{ !cancelled() && needs.version.outputs.test != 'true' && (needs.version.outputs.reuse != '' || (needs.build.result == 'success' && needs.android.result == 'success')) }}
    # Pinned: ubuntu-latest moves to a new release from 19 October 2026.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        if: needs.version.outputs.reuse == ''
        with:
          path: artifacts
          merge-multiple: true
      # Every package from the test build of this commit, as it was built.
      - uses: actions/download-artifact@v4
        if: needs.version.outputs.reuse != ''
        with:
          path: artifacts
          merge-multiple: true
          run-id: ${{ needs.version.outputs.reuse }}
          github-token: ${{ github.token }}
      # The release page stays short so the downloads stay in view: an optional
      # one-line summary (a plain line right under the version's heading in
      # CHANGELOG.md), a link to the full entry and which file to download.
      - name: Release notes
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          HEADING=$(awk -v v="$VERSION" 'index($0, "## " v " ") == 1 || $0 == "## " v { print substr($0, 4); exit }' CHANGELOG.md)
          ANCHOR=$(printf '%s' "$HEADING" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9 -]//g; s/ /-/g')
          SUMMARY=$(awk -v v="$VERSION" '
            index($0, "## " v " ") == 1 || $0 == "## " v { on = 1; next }
            on && NF { if ($0 !~ /^[-*#]/) print; exit }' CHANGELOG.md)
          BETA=""
          if [ "${{ needs.version.outputs.prerelease }}" = true ]; then
            BETA="**Pre-release for testing.** Installed copies do not update to it by themselves, and it updates to the final release when that is out. Export a backup first (Settings → Storage → Back up everything), since this version changes the library database."
          fi
          cat > notes.md <<EOF
          ${BETA:+$BETA

          }${SUMMARY:+$SUMMARY }[Full changelog](https://github.com/${{ github.repository }}/blob/$TAG/CHANGELOG.md#$ANCHOR)

          | System | Download |
          | --- | --- |
          | Windows | \`windows-x64-setup.exe\` or portable \`.zip\` |
          | macOS 13+ | \`macos-universal.dmg\` |
          | Linux | \`linux-x86_64.AppImage\` or \`.flatpak\` |
          | Android 9+ | \`android-arm64.apk\` (32-bit phones: \`android-armv7.apk\`) |
          EOF
          cat notes.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: SCANCORE ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          body_path: notes.md
          generate_release_notes: true
          # Only the packages: the smoke runs' screenshots and logs are
          # artifacts of the same run (an empty one failed 2.16.0's publish).
          files: artifacts/SCANCORE-*

  # AUR, Homebrew and winget manifests with this release's checksums, ready
  # to submit (see packaging/update-manifests.py).
  manifests:
    name: Package manifests
    needs: [version, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.version.outputs.prerelease != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Write and attach the manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if [ ! -f packaging/update-manifests.py ]; then
            echo "::notice::$TAG predates packaging/update-manifests.py."
            exit 0
          fi
          python3 packaging/update-manifests.py "$VERSION" --out "$RUNNER_TEMP/manifests"
          (cd "$RUNNER_TEMP/manifests" && zip -qr "$RUNNER_TEMP/SCANCORE-$VERSION-package-manifests.zip" .)
          gh release upload "$TAG" "$RUNNER_TEMP/SCANCORE-$VERSION-package-manifests.zip" --repo "$GITHUB_REPOSITORY" --clobber
